name: Deploy Jupyter Book to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter Book
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book==1.0.4.post1"

      - name: Build Jupyter Book
        run: |
          jupyter-book build book/

      - name: Locate built site (html or dirhtml)
        id: find-site
        shell: bash
        run: |
          set -e
          CANDIDATES=("book/_build/html" "book/_build/dirhtml")
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then
              echo "site=$d" >> "$GITHUB_OUTPUT"
              echo "Found site at: $d"
              exit 0
            fi
          done
          echo "::error::No built site with index.html found under book/_build (checked html, dirhtml)."
          exit 1

      - name: Disable Jekyll
        run: touch "${{ steps.find-site.outputs.site }}/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find-site.outputs.site }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
