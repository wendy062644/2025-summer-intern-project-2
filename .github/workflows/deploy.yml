name: Deploy Jupyter Book to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter Book
        run: |
          pip install -U jupyter-book

      - name: Build Jupyter Book (html or dirhtml 二擇一；若你有偏好就只留其一)
        run: |
          # 常見是 html；有些教學會用 dirhtml
          jupyter-book build book/ --builder html || true
          jupyter-book build book/ --builder dirhtml || true

      - name: Find built site
        id: find_site
        shell: bash
        run: |
          set -e
          CANDIDATES=("book/_build/html" "book/_build/dirhtml")
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then
              echo "site=$d" >> "$GITHUB_OUTPUT"
              echo "Found site at: $d"
              exit 0
            fi
          done
          echo "::error::No built site with index.html found under book/_build (checked html, dirhtml)."
          exit 1

      - name: Disable Jekyll
        run: |
          touch "${{ steps.find_site.outputs.site }}/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_site.outputs.site }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
