name: Build & Deploy Jupyter Book

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-book ghp-import

      # 如需 dirhtml，將 html 改成 dirhtml 即可；下方會自動偵測
      - name: Build Jupyter Book
        run: jupyter-book build book --builder html

      # 自動找出實際的輸出資料夾（book/_build/html 或 book/_build/dirhtml）
      - name: Find built site
        id: find_site
        shell: bash
        run: |
          CANDIDATES=("book/_build/html" "book/_build/dirhtml")
          for d in "${CANDIDATES[@]}"; do
            if [ -f "$d/index.html" ]; then
              echo "site=$d" >> "$GITHUB_OUTPUT"
              echo "Found site at: $d"
              exit 0
            fi
          done
          echo "::error::No built site with index.html found under book/_build (checked html, dirhtml)."
          exit 1

      # 放置 .nojekyll 在正確的輸出資料夾
      - name: Add .nojekyll
        run: touch "${{ steps.find_site.outputs.site }}/.nojekyll"

      # 發佈到 gh-pages（-f 代表覆蓋）
      - name: Publish to gh-pages
        run: ghp-import -n -p -f "${{ steps.find_site.outputs.site }}"
